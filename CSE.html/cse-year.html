<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSE Year</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#211127,#591163,#2a0f0f);
overflow:hidden;
color:white;
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.08);
animation:float 8s infinite linear;
}

.circle:nth-child(1){
width:180px;
height:180px;
left:10%;
top:20%;
}

.circle:nth-child(2){
width:120px;
height:120px;
right:15%;
bottom:20%;
animation-duration:10s;
}

@keyframes float{

0%{
transform:translateY(0px) rotate(0deg);
}

50%{
transform:translateY(-30px) rotate(180deg);
}

100%{
transform:translateY(0px) rotate(360deg);
}

}

.box{
text-align:center;
z-index:10;
animation:zoom 1.2s;
}

@keyframes zoom{

from{
opacity:0;
transform:scale(.5);
}

to{
opacity:1;
transform:scale(1);
}

}

h1{
font-size:50px;
margin-bottom:15px;
}

p{
font-size:20px;
color:#ddd;
}

button{
margin-top:35px;
padding:12px 30px;
border:none;
border-radius:30px;
font-size:17px;
cursor:pointer;
background:#2563eb;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>

<div class="box">

<h1 id="title"></h1>

<p>This page is ready for future student details.</p>

<button onclick="history.back()">⬅ Back</button>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const year=params.get("year") || "1";

document.getElementById("title").innerHTML=
`Welcome to CSE ${year}${year==1?"st":year==2?"nd":year==3?"rd":"th"} Year`;

</script>

</body>
</html>
