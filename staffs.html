<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffs Management</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }

body { background:#eef3ff; color:#222; padding-bottom:40px; }

header {
    background:#0b4ea2; color:white; padding:22px 20px; text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}
header h1 { font-size:26px; }
header h3 { font-weight:normal; margin-top:6px; opacity:.9; font-size:15px; }

.container { width:95%; max-width:1300px; margin:25px auto; }

.topBar {
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; margin-bottom:20px;
}

.buttons { display:flex; gap:10px; flex-wrap:wrap; }

button, .backBtn {
    padding:11px 16px; border:none; border-radius:8px; background:#0b4ea2;
    color:white; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block;
}
button:hover, .backBtn:hover { background:#083b7a; }

#searchBox { padding:11px 14px; width:260px; max-width:60vw; border:1px solid #ccc; border-radius:8px; font-size:14px; }

.tableWrap { overflow-x:auto; background:white; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,.08); }

table { width:100%; border-collapse:collapse; min-width:700px; }
th, td { padding:13px; border-bottom:1px solid #eee; text-align:center; font-size:14px; }
th { background:#0b4ea2; color:white; white-space:nowrap; }
tbody tr:hover { background:#f5f7ff; }

.rowPhoto { width:44px; height:44px; border-radius:50%; object-fit:cover; }
.noPhoto {
    width:44px; height:44px; border-radius:50%; background:#dbe6ff; color:#0b4ea2;
    display:flex; align-items:center; justify-content:center; margin:auto; font-size:18px;
}
.actionsCell button { background:none; padding:4px 8px; font-size:16px; }
.actionsCell button:hover { background:#eee; border-radius:6px; }

/* Modal */
.modal {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    justify-content:center; align-items:center; z-index:1000; padding:20px;
}
.modal-content {
    background:white; padding:26px; width:460px; max-width:100%; border-radius:14px;
    display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;
    animation:popup .25s;
}
@keyframes popup { from{transform:scale(.85);opacity:0;} to{transform:scale(1);opacity:1;} }

.modal-content h2 { color:#0b4ea2; margin-bottom:4px; }
.modal-content input, .modal-content textarea {
    padding:11px; font-size:14px; border:1px solid #ccc; border-radius:8px; width:100%;
}
.modal-content textarea { resize:vertical; min-height:60px; }

.photoRow { display:flex; align-items:center; gap:14px; }
#photoPreview {
    width:64px; height:64px; border-radius:50%; object-fit:cover; display:none; border:2px solid #0b4ea2;
}

.modal-buttons { display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
.modal-buttons button:last-child, .cancelStyle { background:#888; }
.modal-buttons button:last-child:hover, .cancelStyle:hover { background:#666; }

@media(max-width:600px){
    .topBar{ flex-direction:column; align-items:stretch; }
    #searchBox{ width:100%; max-width:100%; }
}
</style>
</head>

<body data-entity="staffs">

<header>
    <h1>👨‍🏫 Staffs Management</h1>
    <h3 id="pageTitle"></h3>
</header>

<div class="container">

    <div class="topBar">
        <input type="text" id="searchBox" placeholder="🔍 Search by name, ID, phone...">
        <div class="buttons">
            <a class="backBtn" id="backLink">⬅ Back</a>
            <button id="addBtn">➕ Add Staff</button>
            <button id="addColumnBtn">📋 Add Column</button>
            <button id="exportBtn">📤 Export</button>
            <button id="importBtn">📥 Import</button>
            <input type="file" id="importFile" accept="application/json" style="display:none">
        </div>
    </div>

    <div class="tableWrap">
        <table>
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<!-- Add / Edit Record Modal -->
<div id="recordModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Staff</h2>

        <div class="photoRow">
            <img id="photoPreview" alt="preview">
            <input type="file" id="photoInput" accept="image/*">
        </div>

        <input type="text" id="idInput" placeholder="ID">
        <label style="display:none" id="idLabelText"></label>
        <input type="text" id="nameInput" placeholder="Full Name">
        <input type="text" id="phoneInput" placeholder="Phone Number">
        <input type="email" id="emailInput" placeholder="Email">
        <textarea id="addressInput" placeholder="Address"></textarea>

        <div id="extraFields"></div>

        <div class="modal-buttons">
            <button id="saveBtn">💾 Save</button>
            <button id="cancelBtn" class="cancelStyle">❌ Cancel</button>
        </div>
    </div>
</div>

<!-- Add Column Modal -->
<div id="columnModal" class="modal">
    <div class="modal-content">
        <h2>Add Custom Column</h2>
        <input type="text" id="columnNameInput" placeholder="e.g. Blood Group, Aadhaar No, Hostel...">
        <div class="modal-buttons">
            <button id="saveColumnBtn">💾 Add</button>
            <button id="cancelColumnBtn" class="cancelStyle">❌ Cancel</button>
        </div>
    </div>
</div>

<script src="assets/js/safe-storage.js"></script>
<script src="assets/js/people-manager.js"></script>

</body>
</html>
